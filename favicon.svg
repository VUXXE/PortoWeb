<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 80s Phosphor Electron Beam Gradients -->
    <linearGradient id="phosphorGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88ff99"/>
      <stop offset="50%" stop-color="#33ff33"/>
      <stop offset="100%" stop-color="#11aa33"/>
    </linearGradient>
    <linearGradient id="phosphorGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3ffb3"/>
      <stop offset="40%" stop-color="#44ff55"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4324"/>
      <stop offset="100%" stop-color="#081d0f"/>
    </linearGradient>
    <filter id="crtGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

