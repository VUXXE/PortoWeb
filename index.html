<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO // CRT TERMINAL [MODEL 84-CRT]</title>
  
  <!-- Retro Monospace Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/themes.css">
  <link rel="stylesheet" href="/styles/crt.css">
  <link rel="stylesheet" href="/styles/terminal.css">
</head>
<body class="theme-green font-pixel">

  <!-- Hidden SVG Optical Barrel Distortion Filter -->
  <svg class="crt-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;">
    <defs>
      <filter id="crt-barrel-filter" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
        <feImage id="barrel-map-img" x="0%" y="0%" width="100%" height="100%" href="" xlink:href="" result="barrel-map" preserveAspectRatio="none" style="image-rendering: auto;" />
        <feDisplacementMap 
          id="barrel-displacement"
          in="SourceGraphic" 
          in2="barrel-map" 
          scale="18" 
          xChannelSelector="R" 
          yChannelSelector="G" 
          result="displaced" 
        />
      </filter>
    </defs>
  </svg>

  <!-- Full-Page Immersive CRT Terminal Screen -->
  <main class="crt-screen-container" role="main">
    
    <!-- The Convex Glass CRT Screen -->
    <div class="crt-screen has-barrel" id="crt-screen" tabindex="0" aria-label="CRT Terminal Screen">
      
      <!-- Atmospheric Overlays -->
      <div class="crt-vignette" aria-hidden="true"></div>
      <div class="crt-glare" aria-hidden="true"></div>
      <div class="crt-scanlines" aria-hidden="true"></div>

      <!-- Screensaver Canvas Overlays -->
      <canvas id="matrix-canvas" aria-hidden="true"></canvas>
      <div id="fire-overlay" aria-hidden="true"></div>

      <!-- Screen Content (Distorted by Barrel Shader) -->
      <div class="crt-content" id="crt-content">
        
        <!-- CRT Header Status Bar & Integrated HUD Controls -->
        <header class="crt-header-bar">
          <div class="header-meta">
            <span class="meta-item">SYS: <strong>PORTO-OS</strong></span>
            <span class="meta-item">USER: <strong>guest@portoweb</strong></span>
            <span class="meta-item">TTY: <strong>tty0 (9600)</strong></span>
            <span class="meta-item"><strong id="status-clock">00:00:00 UTC</strong></span>
          </div>

          <!-- Integrated CRT Controls -->
          <div class="header-controls" aria-label="CRT Controls">
            <button type="button" class="hud-btn" id="btn-theme" title="Cycle Phosphor Color">
              THEME: <strong id="status-theme">GREEN</strong>
            </button>
            <button type="button" class="hud-btn" id="btn-font" title="Toggle 1980s Pixel Font vs Clean Monospace">
              FONT: <strong id="status-font">PIXEL 80s</strong>
            </button>
            <button type="button" class="hud-btn" id="btn-curvature" title="Adjust Barrel Distortion">
              BARREL: <strong id="status-curvature">AUTHENTIC</strong>
            </button>
            <button type="button" class="hud-btn" id="btn-scanlines" title="Toggle CRT Raster Scanlines">
              SCANLINES: <strong id="status-scanlines">OFF</strong>
            </button>
            <button type="button" class="hud-btn control-active" id="btn-audio" title="Toggle Mechanical Audio">
              AUDIO: <strong id="status-audio">ON</strong>
            </button>
            <button type="button" class="hud-btn" id="btn-degauss" title="Electromagnetic Degauss Coil">
              DEGAUSS
            </button>
            <button type="button" class="hud-btn" id="btn-power" title="Terminal Power Toggle">
              <span class="power-indicator led-active" id="power-led" aria-hidden="true"></span>
              POWER
            </button>
          </div>
        </header>

        <!-- Quick Navigation Command Chips -->
        <nav class="quick-cmd-bar" aria-label="Quick Terminal Commands">
          <button type="button" class="quick-cmd-btn active-tab" data-cmd="dashboard" id="nav-btn-dashboard">[ 0: DASHBOARD ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="about" id="nav-btn-about">[ 1: ABOUT ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="skills" id="nav-btn-skills">[ 2: SKILLS ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="projects" id="nav-btn-projects">[ 3: PROJECTS ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="experience" id="nav-btn-experience">[ 4: HISTORY ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="contact" id="nav-btn-contact">[ 5: CONTACT ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="resume" id="nav-btn-resume">[ 6: RESUME ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="matrix" id="nav-btn-matrix">[ 7: MATRIX ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="fire" id="nav-btn-fire">[ 8: FIRE ]</button>
          <button type="button" class="quick-cmd-btn" data-cmd="help" id="nav-btn-help">[ 9: HELP ]</button>
        </nav>

        <!-- Main Curses TUI Viewport Window (Strictly Non-Scrollable) -->
        <section class="term-viewport" id="term-viewport" aria-label="Terminal Display Viewport"></section>

        <!-- Interactive CLI Footer -->
        <footer class="term-cli-footer">
          <div class="cli-status-line" id="cli-status-line" aria-live="polite">
            [SYS]: SYSTEM READY // SELECT VIEW [0-9] OR TYPE COMMAND
          </div>
          <div class="cli-prompt-line">
            <label for="cli-input" class="prompt-label">
              <span class="prompt-user">guest@portoweb</span>
              <span class="prompt-sep">:</span>
              <span class="prompt-path">~</span>
              <span class="prompt-char">$</span>
            </label>
            <div class="input-container">
              <input 
                type="text" 
                id="cli-input" 
                class="cli-input" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false" 
                aria-label="Terminal command input"
                placeholder="type a command or shortcut number..."
              />
              <span class="custom-cursor" aria-hidden="true"></span>
            </div>
          </div>
        </footer>

      </div>
    </div>
  </main>

  <!-- Application Entrypoint -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
