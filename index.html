<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTFOLIO // CRT TERMINAL [MODEL 84-CRT]</title>
  
  <!-- Retro Monospace Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/themes.css">
  <link rel="stylesheet" href="/styles/crt.css">
  <link rel="stylesheet" href="/styles/terminal.css">
</head>
<body class="theme-green font-pixel">

  <!-- Hidden SVG Optical Barrel Distortion Filter -->
  <svg class="crt-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;">
    <defs>
      <filter id="crt-barrel-filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
        <feImage id="barrel-map-img" x="0%" y="0%" width="100%" height="100%" href="" xlink:href="" result="barrel-map" preserveAspectRatio="none" style="image-rendering: auto;" />
        <feDisplacementMap 
          id="barrel-displacement"
          in="SourceGraphic" 
          in2="barrel-map" 
          scale="8" 
          xChannelSelector="R" 
          yChannelSelector="G" 
          result="displaced" 
        />
      </filter>
    </defs>
  </svg>

  <!-- Full-Page Immersive CRT Terminal Screen -->
  <main class="crt-screen-container" role="main">
    
    <!-- The Convex Glass CRT Screen -->
    <div class="crt-screen has-barrel" id="crt-screen" tabindex="0" aria-label="CRT Terminal Screen">
      
      <!-- Atmospheric Overlays -->
      <div class="crt-vignette" aria-hidden="true"></div>
      <div class="crt-glare" aria-hidden="true"></div>
      <div class="crt-scanlines" aria-hidden="true"></div>

      <!-- Screensaver Canvas Overlays -->
      <canvas id="matrix-canvas" aria-hidden="true"></canvas>
      <div id="fire-overlay" aria-hidden="true"></div>

      <!-- Screen Content (Distorted by Barrel Shader) -->
      <div class="crt-content" id="crt-content">
        <!-- Pure Fullscreen Interactive CLI Terminal Shell -->
        <div class="cli-shell" id="cli-shell">
          <div class="cli-output-buffer" id="cli-output-buffer" role="log" aria-live="polite">
            <!-- Active Interactive Prompt Line -->
            <div class="cli-prompt-line" id="cli-prompt-line">
              <label for="cli-input" class="prompt-label">
                <span class="prompt-user">guest@portoweb</span><span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-char">$</span>
              </label>
              <div class="input-container">
                <input 
                  type="text" 
                  id="cli-input" 
                  class="cli-input" 
                  autocomplete="off" 
                  autocorrect="off" 
                  autocapitalize="off" 
                  spellcheck="false" 
                  aria-label="Terminal command input"
                  autofocus
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Application Entrypoint (TypeScript) -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
