<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASYDEV-OS // MODEL 84-CRT TERMINAL</title>
  <meta name="description" content="ASYDEV-OS: Retro DEC VT220 / CRT Terminal Portfolio for Asy-Syahid Abdurrahman Hanan Taqiyya. Full-stack & systems software engineer.">
  <link rel="canonical" href="https://asy.web.id/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://asy.web.id/">
  <meta property="og:title" content="ASYDEV-OS // MODEL 84-CRT TERMINAL">
  <meta property="og:description" content="Retro CRT Terminal Portfolio for Asy-Syahid Abdurrahman Hanan Taqiyya. Full-stack & systems software engineer.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="https://asy.web.id/">
  <meta name="twitter:title" content="ASYDEV-OS // MODEL 84-CRT TERMINAL">
  <meta name="twitter:description" content="Retro CRT Terminal Portfolio for Asy-Syahid Abdurrahman Hanan Taqiyya. Full-stack & systems software engineer.">
  
  <!-- Retro Monospace Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/themes.css">
  <link rel="stylesheet" href="/styles/crt.css">
  <link rel="stylesheet" href="/styles/terminal.css">
</head>
<body class="theme-green font-pixel">

  <!-- Full-Page Immersive CRT Terminal Screen -->
  <main class="crt-screen-container" role="main">
    
    <!-- The Convex Glass CRT Screen -->
    <div class="crt-screen curvature-authentic" id="crt-screen" tabindex="0" aria-label="CRT Terminal Screen">
      
      <!-- Atmospheric Overlays -->
      <div class="crt-vignette" aria-hidden="true"></div>
      <div class="crt-glare" aria-hidden="true"></div>
      <div class="crt-scanlines" aria-hidden="true"></div>

      <!-- Screensaver Canvas Overlays -->
      <canvas id="matrix-canvas" aria-hidden="true"></canvas>
      <div id="fire-overlay" aria-hidden="true"></div>

      <!-- Screen Content (Distorted by Barrel Shader) -->
      <div class="crt-content" id="crt-content">
        <!-- Pure Fullscreen Interactive CLI Terminal Shell -->
        <div class="cli-shell" id="cli-shell">
          <div class="cli-output-buffer" id="cli-output-buffer" role="log" aria-live="polite">
            <!-- Active Interactive Prompt Line -->
            <div class="cli-prompt-line" id="cli-prompt-line">
              <label for="cli-input" class="prompt-label">
                <span class="prompt-user">guest@asy.web.id</span><span class="prompt-sep">:</span><span class="prompt-path" id="prompt-path">~</span><span class="prompt-char">$</span>
              </label>
              <div class="input-container">
                <input 
                  type="text" 
                  id="cli-input" 
                  class="cli-input" 
                  autocomplete="off" 
                  autocorrect="off" 
                  autocapitalize="off" 
                  spellcheck="false" 
                  aria-label="Terminal command input"
                  autofocus
                />
                <div class="cli-display-line" id="cli-display-line" aria-hidden="true">
                  <span class="cli-text-before" id="cli-text-before"></span><span class="cli-block-cursor" id="cli-block-cursor"> </span><span class="cli-text-after" id="cli-text-after"></span><span class="cli-ghost-hint" id="cli-ghost-hint"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Tmux / VT220 Status Line -->
          <div class="cli-statusbar" id="cli-statusbar" role="status" aria-label="Terminal status line">
            <div class="statusbar-left">
              <span class="statusbar-tag">[ASYDEV-OS]</span>
              <span class="statusbar-item" id="sb-tty">tty0</span>
              <span class="statusbar-sep">│</span>
              <span class="statusbar-item" id="sb-user">guest@asy.web.id</span>
              <span class="statusbar-sep">│</span>
              <span class="statusbar-item" id="sb-cwd">~</span>
            </div>
            <div class="statusbar-right">
              <span class="statusbar-item" id="sb-term">DEC VT220</span>
              <span class="statusbar-sep">│</span>
              <span class="statusbar-item" id="sb-enc">UTF-8</span>
              <span class="statusbar-sep">│</span>
              <span class="statusbar-item" id="sb-clock">00:00:00 UTC</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Application Entrypoint (TypeScript) -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
